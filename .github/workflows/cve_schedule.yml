name: 24/7 CVE Threat Intelligence Bot

on:
  schedule:
    # Runs every 30 minutes (24/7/365) for faster exploit detection
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime!

jobs:
  check-cves:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit seen_cves.json back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Threat Intel Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cve_intel_bot.py

      - name: Commit and Push Updated Baseline
        run: |
          git config --global user.name "Sandeep-Bot"
          git config --global user.email "bot@realsandeep1271.ui"
          git add seen_cves.json seen_ghsa.json cisa_kev_cache.json bot_state.json 2>/dev/null || true
          if git diff-index --quiet HEAD --; then
            echo "No new CVEs to commit."
          else
            git commit -m "chore: update threat intel baseline [skip ci]"
            git push
          fi
